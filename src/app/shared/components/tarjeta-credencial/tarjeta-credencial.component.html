<div
  class="credencial-container"
  [class.layout-stack]="layout === 'stack'"
  [class.layout-side]="layout === 'side-by-side'"
  [class.layout-auto]="layout === 'auto'"
  [class.modo-impresion]="isImpresion"
  [class.modo-digital]="!isImpresion"
  [style.--branding-card-background]="fondoTarjeta"
  [style.--branding-card-background-dark]="fondoTarjetaOscuro"
  [style.--branding-card-background-deep]="fondoTarjetaProfundo"
  [style.--branding-card-text]="colorLetra"
  [style.--branding-card-pattern]="patronFondo"
>
  <div class="branding-preview-stack">
    <!-- TARJETA CREDENCIAL UNIFICADA (CONTADORES Y SOCIEDADES) -->
    <article
      class="branding-id-card"
      [class.modo-impresion]="isImpresion"
      [class.modo-digital]="!isImpresion"
      [attr.aria-label]="tipo === 'sociedad' ? 'Vista previa de la tarjeta profesional de la sociedad' : 'Vista previa de la tarjeta profesional del contador'"
    >
      <!-- Fila 1: Logo Institucional Oficial -->
      <div class="credencial-card-logo-row">
        <img
          [src]="logoUrl"
          id="brandingPreviewLogo"
          class="credencial-card-logo branding-card-logo"
          alt="Logo de la Junta Central de Contadores"
          (error)="onLogoError($event)"
        />
      </div>

      <!-- Fila 2: Foto/Logo + Datos Laterales -->
      <div class="credencial-card-main">
        <img
          class="credencial-card-photo"
          [src]="fotoUrl"
          [alt]="tipo === 'sociedad' ? 'Logo de la sociedad' : 'Fotografía del contador'"
        />
        <div class="credencial-card-side">
          <div class="credencial-card-info">
            <span class="credencial-card-label">{{ labelRegistro }}</span>
            <div class="credencial-card-registration">
              <strong class="credencial-card-value">{{ valorRegistro }}</strong>
              <span
                class="credencial-card-copy"
                (click)="copiarMatricula($event)"
                role="button"
                tabindex="0"
                [title]="copiadoExitoso ? '¡Copiado!' : 'Copiar número'"
                aria-label="Copiar número"
              >
                <svg *ngIf="!copiadoExitoso" class="credencial-copy-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2.5" ry="2.5"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span *ngIf="copiadoExitoso" class="fa fa-check text-success" style="font-size: 13px;"></span>
              </span>
            </div>
          </div>
          <div class="credencial-card-info">
            <span class="credencial-card-label">{{ labelFecha }}</span>
            <strong class="credencial-card-value">{{ valorFecha }}</strong>
          </div>
          <div class="credencial-card-info">
            <span class="credencial-card-label">{{ labelMedio3 }}</span>
            <strong class="credencial-card-value">{{ valorMedio3 }}</strong>
          </div>
        </div>
      </div>

      <!-- Fila 3: Grilla de Detalles Inferiores (4 Campos) -->
      <div class="credencial-card-details">
        <div class="credencial-card-info">
          <span class="credencial-card-label">{{ labelTitular }}</span>
          <strong class="credencial-card-value">{{ valorTitular }}</strong>
        </div>
        <div class="credencial-card-info">
          <span class="credencial-card-label">{{ labelDocumento }}</span>
          <strong class="credencial-card-value">{{ valorDocumento }}</strong>
        </div>
        <div class="credencial-card-info">
          <span class="credencial-card-label">{{ labelExtra }}</span>
          <strong class="credencial-card-value">{{ valorExtra }}</strong>
        </div>
        <div class="credencial-card-info">
          <span class="credencial-card-label">{{ labelPie2Der }}</span>
          <strong class="credencial-card-value">{{ valorPie2Der }}</strong>
        </div>
      </div>
    </article>
  </div>
</div>
