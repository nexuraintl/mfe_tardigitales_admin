<!-- 1. Header Web Component (Oculto en ruta de verificación pública) -->
<nx-admin-header
  *ngIf="!isPublicRoute"
  [appTitle]="'Tarjetas Digitales'"
  [currentUser]="currentUser"
  [appGrid]="appGrid"
  show-search="false"
  (nx-toggle-sidebar)="onToggleSidebar()"
  (nx-navigate)="onNavigate($any($event))"
  (nx-app-change)="onAppChange($any($event))"
  (nx-profile-action)="onProfileAction($any($event))">
</nx-admin-header>

<div [class.main-container]="!isPublicRoute" [style.display]="!isPublicRoute ? 'flex' : 'block'" [style.min-height]="!isPublicRoute ? 'calc(100vh - 64px)' : '100vh'" style="background-color: #f1f5f9;">
  <!-- 2. Sidebar de navegación (Oculto en ruta pública) -->
  <nx-admin-mod-sidebar
    *ngIf="!isPublicRoute"
    [menuSections]="menuSections"
    [activePath]="currentUrl"
    [primaryAction]="primaryAction"
    [collapsed]="sidebarCollapsed"
    (nx-sidebar-change)="sidebarCollapsed = $any($event).detail?.collapsed"
    (nx-navigate)="onNavigate($any($event))"
    (nx-primary-action)="onPrimaryAction($any($event))">
  </nx-admin-mod-sidebar>

  <!-- 3. Área principal de contenido -->
  <main class="content-area" [style.flex]="!isPublicRoute ? '1' : 'none'" style="min-width: 0; display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Barra de opciones / Título de vista y botones dinámicos (Oculto en ruta pública) -->
    <nx-admin-mod-options
      *ngIf="!isPublicRoute"
      [pageTitle]="pageTitle"
      [showBackButton]="true"
      [actions]="viewActions"
      (nx-action)="ejecutarAccion($any($event).detail)"
      (nx-back)="onBack()">
    </nx-admin-mod-options>

    <!-- 4. Contenedor de contenido ÚNICO donde se proyecta el router de Angular -->
    <div [class.p-4]="!isPublicRoute" style="flex: 1; width: 100%;">
      <router-outlet (activate)="onRouteActivate($event)"></router-outlet>
    </div>

    <!-- 5. Footer Web Component (Oculto en ruta pública) -->
    <nx-admin-footer *ngIf="!isPublicRoute" [version]="'Versión 1.0.0'"></nx-admin-footer>
  </main>
</div>
