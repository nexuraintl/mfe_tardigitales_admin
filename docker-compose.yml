version: '3.8'

services:
  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfe-tardigitales-admin
    ports:
      - "4300:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - angular-network
      - local-gateway_default

networks:
  angular-network:
    driver: bridge
  local-gateway_default:
    external: true
